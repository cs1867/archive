name: single-archive-workflow

on: 
  push:  
    branches: 
      - github-workflow 
env:
  BUILD_OS: u20 
 
jobs:
  archive-daemon:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Check out Repo
        uses: actions/checkout@v4
        with:
          ref: 5.2.0

      # Fetch workflow script from projects
      - name: Fetch workflow script from projects
        env:
          github-token: ${{ secrets.GIT_ACTIONS }}
        run: |
          git clone https://github.com/cs1867/project.git project
          case "${{ env.BUILD_OS }}" in
            'ol8'|'el9')
              cp project/toolbox/workflows/github-el-workflow.sh .
              ;;
            'd11'|'d12'|'u20'|'u24')
              cp project/toolbox/workflows/github_u20_workflow.sh .
              ;;
          esac

      - name: show run id
        run: |
          echo "${{ github.run_id }}"
          
      # Download artifacts
      - name: Download artifacts
        run: |
          mkdir -p artifacts
          echo "Downloading artifact for minor-packages"
          echo "Run ID: 12224991337"
          gh run download 12224991337 --repo cs1867/minor-packages -D artifacts/minor-packages --name "minor-packages-${{ env.BUILD_OS }}"
          artifact_path="artifacts/pscheduler"
          echo "Downloading artifact for pscheduler"
          echo "Run ID: 12214356399"
          gh run download 12214356399 --repo cs1867/pscheduler -D artifacts/pscheduler --name "pscheduler-${{ env.BUILD_OS }}"  
          echo "Downloading artifact for perl-shared"
          echo "Run ID: 12214489752"
          gh run download 12214489752 --repo cs1867/perl-shared -D artifacts/perl-shared --name "perl-shared-${{ env.BUILD_OS }}"  
          echo "Downloading artifact for psconfig"
          echo "Run ID: 12214537914"
          gh run download 12214537914 --repo cs1867/psconfig -D artifacts/psconfig --name "psconfig-${{ env.BUILD_OS }}"  
          echo "Downloading artifact for elmond"
          echo "Run ID: 12215386153"
          gh run download 12215386153 --repo cs1867/elmond -D artifacts/elmond --name "elmond-${{ env.BUILD_OS }}"  
          echo "Downloading artifact for host-metrics"
          echo "Run ID: 12215363367"
          gh run download 12215363367 --repo cs1867/host-metrics -D artifacts/host-metrics --name "host-metrics-${{ env.BUILD_OS }}"  
          echo "Downloading artifact for logstash"
          echo "Run ID: 12216154334"
          gh run download 12216154334 --repo cs1867/logstash -D artifacts/logstash --name "logstash-${{ env.BUILD_OS }}"  
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_ACTIONS }}

      # Run docker oneshot builder and workflow script
      - name: Run Docker oneshot builder
        run: |
          case "${{ env.BUILD_OS }}" in
            'ol8'|'el9')
              curl -s https://raw.githubusercontent.com/perfsonar/docker-oneshot-builder/main/build | sh -s - --run github-el-workflow.sh . '${{ env.BUILD_OS }}'
              ;;
            'd11'|'d12'|'u20'|'u24')
              curl -s https://raw.githubusercontent.com/perfsonar/docker-oneshot-builder/main/build | sh -s - --run github_u20_workflow.sh . '${{ env.BUILD_OS }}'
              ;;
          esac

          
      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ github.event.repository.name }}-${{ env.BUILD_OS }}
          path: unibuild-repo
          retention-days: 5
